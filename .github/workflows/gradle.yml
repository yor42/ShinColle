# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  workflow_dispatch:
  push:
    branches: [ mc-1.12.2 ]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ mc-1.12.2 ]

jobs:
  build-and-update:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 8
      uses: actions/setup-java@v2
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Get mod version
      id: mod_version
      shell: pwsh
      run: |
        $content = Get-Content "gradle.properties"
        $version = ($content | Select-String -Pattern "mod_version\s*=\s*(.*)").Matches.Groups[1].Value.Trim()
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Get current date
      id: date
      env:
        TZ: 'Asia/Seoul'
      run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v2
      with:
        arguments: build

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      if: github.event_name == 'push' && github.ref == 'refs/heads/mc-1.12.2'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: build-${{ steps.mod_version.outputs.version }}-${{ steps.date.outputs.date }}
        release_name: Build ${{ steps.mod_version.outputs.version }} (${{ steps.date.outputs.date }})
        body: |
          Automated build for version ${{ steps.mod_version.outputs.version }}
          Build date: ${{ steps.date.outputs.date }}
          
          This is an automated pre-release build. For stable releases, please check the non-prerelease versions.
        draft: false
        prerelease: true

    - name: Upload Release Asset (Main JAR)
      uses: actions/upload-release-asset@v1
      if: github.event_name == 'push' && github.ref == 'refs/heads/mc-1.12.2'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}/build/libs/shincolle-${{ steps.mod_version.outputs.version }}.jar
        asset_name: shincolle-${{ steps.mod_version.outputs.version }}.jar
        asset_content_type: application/java-archive

    - name: Upload Release Asset (Dev JAR)
      uses: actions/upload-release-asset@v1
      if: github.event_name == 'push' && github.ref == 'refs/heads/mc-1.12.2'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}/build/libs/shincolle-${{ steps.mod_version.outputs.version }}-dev.jar
        asset_name: shincolle-${{ steps.mod_version.outputs.version }}-dev.jar
        asset_content_type: application/java-archive

    - name: Upload Release Asset (Sources JAR)
      uses: actions/upload-release-asset@v1
      if: github.event_name == 'push' && github.ref == 'refs/heads/mc-1.12.2'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ github.workspace }}/build/libs/shincolle-${{ steps.mod_version.outputs.version }}-sources.jar
        asset_name: shincolle-${{ steps.mod_version.outputs.version }}-sources.jar
        asset_content_type: application/java-archive

    - name: Upload Artifact
      uses: actions/upload-artifact@master
      if: always()
      with:
        name: ShinColle-unofficial
        path: ${{ github.workspace }}/build/libs