# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [ mc-1.12.2 ]
    tags:
      - 'v*'
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ mc-1.12.2 ]

# Least privilege by default; the publishing jobs below raise only what they need.
permissions:
  contents: read

# Superseded pull request runs are cancelled; push and tag runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    if: "github.event_name == 'pull_request'"
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: wrapper

      - name: Configure Gradle Properties
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gradle" | Out-Null
          Add-Content $env:USERPROFILE\.gradle\gradle.properties "systemProp.https.protocols=TLSv1.2"
          Add-Content $env:USERPROFILE\.gradle\gradle.properties "org.gradle.jvmargs=-Xmx3G -Dhttps.protocols=TLSv1.2"

      # build runs the unit tests (test task) and assembles the jar; a failing test fails the job
      - name: Build and test with Gradle
        shell: pwsh
        run: ./gradlew.bat build
        env:
          GRADLE_OPTS: "-Dhttps.protocols=TLSv1.2 -Dorg.gradle.daemon=false"

      - name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: ignore

  pre-release:
    runs-on: windows-latest
    if: "!startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' && github.ref == 'refs/heads/mc-1.12.2'"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: wrapper

      - name: Configure Gradle Properties
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gradle" | Out-Null
          Add-Content $env:USERPROFILE\.gradle\gradle.properties "systemProp.https.protocols=TLSv1.2"
          Add-Content $env:USERPROFILE\.gradle\gradle.properties "org.gradle.jvmargs=-Xmx3G -Dhttps.protocols=TLSv1.2"

      - name: Get mod version
        id: mod_version
        shell: pwsh
        run: |
          $content = Get-Content "gradle.properties"
          $version = ($content | Select-String -Pattern "mod_version\s*=\s*(.*)").Matches.Groups[1].Value.Trim()
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Get current date
        id: date
        env:
          TZ: 'Asia/Seoul'
        run: echo "NOW=$(date +'%Y%m%d-%H%M%S')" >> $env:GITHUB_ENV

      - name: Build with Gradle
        shell: pwsh
        run: ./gradlew.bat build
        env:
          GRADLE_OPTS: "-Dhttps.protocols=TLSv1.2 -Dorg.gradle.daemon=false"

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Build ${{ env.VERSION }} (${{ env.NOW }})
          tag_name: v${{ env.VERSION }}-${{ env.NOW }}
          body: |
            Bleeding Edge Build for version ${{ env.VERSION }}
            Build date: ${{ env.NOW }}
            
            This is an automatic build. it might be unstable. Here be dragons!
          draft: false
          prerelease: true
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ShinColle
          path: ${{ github.workspace }}/build/libs
  release:
    runs-on: windows-latest
    if: "startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: wrapper

      - name: Configure Gradle Properties
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gradle" | Out-Null
          Add-Content $env:USERPROFILE\.gradle\gradle.properties "systemProp.https.protocols=TLSv1.2"
          Add-Content $env:USERPROFILE\.gradle\gradle.properties "org.gradle.jvmargs=-Xmx3G -Dhttps.protocols=TLSv1.2"

      - name: Get mod version
        id: mod_version
        shell: pwsh
        run: |
          $content = Get-Content "gradle.properties"
          $version = ($content | Select-String -Pattern "mod_version\s*=\s*(.*)").Matches.Groups[1].Value.Trim()
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Get current date
        id: date
        env:
          TZ: 'Asia/Seoul'
        run: echo "NOW=$(date +'%Y%m%d-%H%M%S')" >> $env:GITHUB_ENV

      - name: Build with Gradle
        shell: pwsh
        run: ./gradlew.bat build
        env:
          GRADLE_OPTS: "-Dhttps.protocols=TLSv1.2 -Dorg.gradle.daemon=false"

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Release ${{ env.VERSION }}
          body: |
            Release version ${{ env.VERSION }}
            Build date: ${{ env.NOW }}
          draft: false
          prerelease: false
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ShinColle-unofficial
          path: ${{ github.workspace }}/build/libs