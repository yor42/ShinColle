# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Shadow
enable_shadow = false

# Set this to true if you want to use old LWJGL2 methods.
# WARNING: Using LWJGL2 is no longer recommend, and some methods in LWJGL2 will be unavailable.
enable_lwjglx = true

# Mod Information
# HIGHLY RECOMMEND complying with SemVer for mod_version: https://semver.org/
mod_version = 1.12.2.1.11
root_package = com.lulan
mod_id = shincolle
mod_name = Shinkeiseikan Collection

# Mod Metadata (Optional)
mod_description =Collect cute SeiKan mobs!  forum: http://forum.gamer.com.tw/C.php?bsn=18673&snA=124090&tnum=1  github: https://github.com/PinkaLulan/ShinColle  Sound Source: Amitaro's Sound Material Workshop http://www14.big.or.jp/~amiami/happy/index.html  Unofficial 1.12.2 port completed by Theray070696 and MystiaLorelei.
mod_url =https://github.com/misaka10843/ShinColle
mod_update_json =
# Delimit authors with commas
mod_authors =PinkaLulan, misaka10843,KCFindstr,sddsd2332,Cappycot,yor42
mod_credits =Thanks to Pahimar, diesieben07, Jabelar, coolAlias, Neale and all the tutorials on the web _(:3
mod_logo_path =
mod_issue_tracker =https://github.com/yor42/ShinColle/issues

# Run Configurations
# If multiple arguments/tweak classes are stated, use spaces as the delimiter
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false

# Maven Publishing (Provide secret: MAVEN_USER, MAVEN_PASS)
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# If any properties changes below this line, refresh gradle again to ensure everything is working correctly.
# ----------------------------------------------------------------------------------------------------------------------

# Access Transformers (none used by ShinColle at present)
use_access_transformer = false

# Mixins (none used by ShinColle at present; set true and add src/main/resources/${mod_id}.mixin.json to use)
use_mixins = false

# Coremods (none)
is_coremod = false
coremod_includes_mod = false
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
