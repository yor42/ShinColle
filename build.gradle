plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'xyz.wagyourtail.unimined' version '1.4.43-kappa'
    id 'net.kyori.blossom' version '2.2.0'
}

import org.jetbrains.gradle.ext.Gradle

ext {
    //noinspection GroovyAssignabilityCheck
    access_transformer_locations = "${mod_id}_at.cfg"
}

version = mod_version
group = root_package

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (generate_sources_jar.toBoolean()) {
        withSourcesJar()
    }
    if (generate_javadocs_jar.toBoolean()) {
        withJavadocJar()
    }
}

configurations {
    contain
    implementation.extendsFrom(contain)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

def remapTaskName = enable_shadow.toBoolean() ? "remapShadowJar" : "remapJar"

//noinspection GroovyAssignabilityCheck
unimined.minecraft {
    version "1.12.2"

    mappings {
        mcp("stable", "39-1.12")
    }

    cleanroom {
        if (use_access_transformer.toBoolean()) {
            accessTransformer "${rootProject.projectDir}/src/main/resources/$access_transformer_locations"
        }
        loader "0.6.13-alpha"
        runs.all {
            if (use_mixins.toBoolean()) {
                systemProperty("crl.dev.mixin", "${mod_id}.mixin.json")
            }
            args += ['--username', minecraft_username]
            def extraArgs = extra_jvm_args
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                jvmArgs += extraArgs.split { "\\s+" }.toList()
            }
            if (enable_foundation_debug.toBoolean()) {
                systemProperty("foundation.dump", "true")
                systemProperty("foundation.verbose", "true")
            }
            if (is_coremod.toBoolean()) {
                systemProperty("fml.coreMods.load", coremod_plugin_class_name)
            }
            return
        }
    }

    defaultRemapJar = false
    
    String jarTaskName = enable_shadow.toBoolean() ? "shadowJar" : "jar"
    
    remap(tasks.named(jarTaskName).get()) {
        if (use_mixins.toBoolean()) {
            mixinRemap {
                enableBaseMixin()
                enableMixinExtra()
            }
        }
    }

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

dependencies {
    if (use_asset_mover.toBoolean()) {
        implementation "com.cleanroommc:assetmover:${asset_mover_version}"
    }
    if (enable_junit_testing.toBoolean()) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

processResources {
    rename '(.+_at.cfg)', 'META-INF/$1'
}

sourceSets {
    main {
        blossom {
            javaSources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('package', "${root_package}.${mod_id}")
            }
            resources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('mod_description', mod_description)
                property('mod_authors', mod_authors.toString().split(',').findAll { !it.isBlank() }.collect { "\"${it.strip()}\"" }.join(', '))
                property('mod_credits', mod_credits)
                property('mod_url', mod_url)
                property('mod_update_json', mod_update_json)
                property('mod_logo_path', mod_logo_path)
                property('mod_issue_tracker', mod_issue_tracker)
            }
        }
    }
    // Unimined adds Minecraft to main only; tests need the same classpath
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
    // Dev-only in-game test harness (src/gametest); never part of the mod jar
    gametest {
        compileClasspath += main.compileClasspath + main.output
    }
}

// ./gradlew runClient -Pgametest runs the scripted in-game checks (docs/porting/reports/2026-10-13-gametest-harness.md)
if (project.hasProperty('gametest')) {
    dependencies {
        runtimeOnly sourceSets.gametest.output
    }
    tasks.matching { it.name == 'runClient' }.configureEach {
        systemProperty 'shincolle.gametest', 'true'
        // dedicated-server mode: -Pgametest_connect=host:port -Pgametest_rcon=host:port -Pgametest_rconpass=...
        ['connect', 'rcon', 'rconpass'].each { key ->
            if (project.hasProperty("gametest_${key}")) systemProperty "shincolle.gametest.${key}", project.property("gametest_${key}")
        }
    }

    // Writes build/gametest-server.args so the dedicated server can be started with plain `java @file`
    // (separate working directory, no second Gradle process while the client runs). Dev only.
    tasks.register('gametestServerArgs') {
        dependsOn 'classes', 'gametestClasses', 'preRunServer'
        def outFile = layout.buildDirectory.file('gametest-server.args')
        doLast {
            def t = tasks.getByName('runServer')
            def lines = []
            t.jvmArgs.each { lines << it.toString() }
            lines << '-Xmx1536M'
            lines << '-Dshincolle.gametest.server=true'
            lines << '-cp' << t.classpath.asPath
            lines << t.mainClass.get()
            t.args.each { lines << it.toString() }
            // environment variables the run config adds on top of the inherited ones (the launcher reads `mainClass`)
            def extraEnv = t.environment.findAll { k, v -> System.getenv(k.toString()) != v?.toString() }
            // The run config leaves unresolved Unimined placeholders (${mcp_to_srg}, ${source_roots}); the dev
            // classpath is passed through -Dcrl.dev.extrapath already, so resolve them to usable values here.
            def srgFile = file('.gradle/unimined/local/mappings/srg2mcp.tsrg')
            extraEnv = extraEnv.collectEntries { k, v ->
                def s = v?.toString() ?: ''
                if (s.contains('${')) s = (k.toString() == 'MCP_TO_SRG' && srgFile.exists()) ? srgFile.absolutePath : ''
                [(k): s]
            }
            layout.buildDirectory.file('gametest-server.env').get().asFile.text =
                    extraEnv.collect { k, v -> "${k}=${v}" }.join(System.lineSeparator())

            // Server setup: ships extend EntityAnimal, which vanilla removes on tick 1 when spawn-animals=false
            // (diagnosis: docs/porting/reports/2026-10-13-gametest-harness.md). Force the three spawn keys.
            def serverDir = file('run/server-gametest')
            serverDir.mkdirs()
            def propsFile = new File(serverDir, 'server.properties')
            def want = ['spawn-animals': 'true', 'spawn-npcs': 'true', 'spawn-monsters': 'false']
            def propLines = propsFile.exists() ? propsFile.readLines() : []
            want.each { key, val ->
                int idx = propLines.findIndexOf { it.startsWith(key + '=') }
                if (idx >= 0) propLines[idx] = "${key}=${val}" else propLines << "${key}=${val}"
            }
            propsFile.text = propLines.join(System.lineSeparator()) + System.lineSeparator()
            outFile.get().asFile.text = lines.collect { '"' + it.replace('\\', '/') + '"' }.join(System.lineSeparator())
        }
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                '1. Build'(Gradle) {
                    taskNames = ["build"]
                }
                '2. Run Client'(Gradle) {
                    taskNames = ["runClient"]
                }
                '3. Run Server'(Gradle) {
                    taskNames = ["runServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = '-encoding utf8'
                    moduleJavacAdditionalOptions = [
                            (project.name + '.main'): tasks.compileJava.options.compilerArgs.collect { "\"${it}\"" }.join(' ')
                    ]
                }
            }
            taskTriggers {
                beforeSync tasks.named("genSources")
            }
        }
    }
}

if (!enable_shadow.toBoolean()) {
    shadowJar.enabled = false
}

compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    if (configurations.contain.size() > 0) {
        into('/') {
            from configurations.contain
        }
    }
    doFirst {
        manifest {
            def attribute_map = [:]
            attribute_map['ModType'] = "CRL"
            if (use_mixins.toBoolean()) {
                attribute_map['MixinConfigs'] = "${mod_id}.mixin.json"
            }
            if (configurations.contain.size() > 0) {
                attribute_map['ContainedDeps'] = configurations.contain.collect { it.name }.join(' ')
                attribute_map['NonModDeps'] = true
            }
            if (is_coremod.toBoolean()) {
                attribute_map['FMLCorePlugin'] = coremod_plugin_class_name
                if (coremod_includes_mod.toBoolean()) {
                    attribute_map['FMLCorePluginContainsFMLMod'] = true
                }
            }
            if (use_access_transformer.toBoolean()) {
                attribute_map['FMLAT'] = access_transformer_locations
            }
            attributes(attribute_map)
        }
    }
    finalizedBy(tasks.named(remapTaskName).get())
}


shadowJar {
    //noinspection GroovyAssignabilityCheck,GroovyAccessibility
    configurations = [project.configurations.shadow]
    archiveClassifier = "shadow"
}

compileTestJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
    if (show_testing_output.toBoolean()) {
        testLogging {
            showStandardStreams = true
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forward stdin to the dedicated server console so smoke runs can pipe commands
// (they run on the server thread; RCON commands do not and race world saving)
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
